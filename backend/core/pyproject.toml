# Backend (Core Service) project metadata and tool configuration.
# Dependencies live in requirements.txt / requirements-dev.txt (pinned). This file is not a
# build definition: the service is run from source, not installed as a package.
[project]
name = "gradian-core"
version = "0.1.0"
description = "Gradian Core Service: identity cache, panels and group-service registry"
requires-python = ">=3.13"

# Run through `make lint` and `make format`, which execute inside the tools container.
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplifications
    "DJ",       # django
    "S",        # bandit (security)
    "PTH",      # pathlib
    "T20",      # no print() in application code
    "RUF",
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Persian text legitimately contains look-alike characters
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S107", "S311"]   # asserts, fake secrets and tokens in tests
"manage.py" = ["T20"]
"../packages/run_tests.py" = ["T20"]
"../packages/**/tests/**" = ["S101", "S105", "S106", "S107", "S311"]
"../scripts/**" = ["T20", "S603", "S607"]
"../scripts/tests/**" = ["S101", "S105", "S106", "S311"]

[tool.ruff.lint.isort]
known-first-party = [
    "gradian",
    "common",
    "accounts",
    "tests",
    "gradian_keycloak",
    "gradian_auth",
    "gradian_testing",
]

[tool.ruff.format]
quote-style = "double"

# Strict mode is on for everything, tests and scripts included. Use `# type: ignore[code]`
# only with a reason after it (see CONTRIBUTING.md).
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["/migrations/"]

[tool.django-stubs]
django_settings_module = "gradian.settings_test"

[[tool.mypy.overrides]]
# Generated by the Django plugin's model inspection; nothing to check here.
module = ["*.migrations.*"]
ignore_errors = true
