# Team 1: University entrance exam simulation. Port 8001.
# Run from the repo root with `make 1`, or alone here with `docker compose up --build`
# (needs `docker network create gradian` once and a .env copied from .env.example).
name: gradian-team1
services:
  team1:
    build:
      context: .
      additional_contexts:
        packages: ../../packages
    env_file: .env
    volumes: [".:/app"]
    # Bound to localhost only: this is a development service. The service validates every token itself.
    ports: ["127.0.0.1:8001:8001"]

networks:
  default:
    name: gradian
    external: true
