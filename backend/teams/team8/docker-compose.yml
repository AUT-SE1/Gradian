# Team 8: Question and test-related services. Port 8008.
# Run from the repo root with `make 8`, or alone here with `docker compose up --build`
# (needs `docker network create gradian` once and a .env copied from .env.example).
name: gradian-team8
services:
  team8:
    build: .
    env_file: .env
    volumes: [".:/app"]
    # Bound to localhost only: the service trusts the X-User-* headers the core gateway sets,
    # so the outside world must reach it through the gateway (/api/teams/8/), never directly.
    ports: ["127.0.0.1:8008:8008"]

networks:
  default:
    name: gradian
    external: true
