# Team 10: Other educational support services. Port 8010.
# Run from the repo root with `make 10`, or alone here with `docker compose up --build`
# (needs `docker network create gradian` once and a .env copied from .env.example).
name: gradian-team10
services:
  team10:
    build: .
    env_file: .env
    volumes: [".:/app"]
    # Bound to localhost only: the service trusts the X-User-* headers the core gateway sets,
    # so the outside world must reach it through the gateway (/api/teams/10/), never directly.
    ports: ["127.0.0.1:8010:8010"]

networks:
  default:
    name: gradian
    external: true
