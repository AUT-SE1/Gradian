# Team 4: Private classes. Port 8004.
# Run from the repo root with `make 4`, or alone here with `docker compose up --build`
# (needs `docker network create gradian` once and a .env copied from .env.example).
name: gradian-team4
services:
  team4:
    build:
      context: .
      additional_contexts:
        packages: ../../packages
    env_file: .env
    volumes: [".:/app"]
    # Bound to localhost only: this is a development service. The service validates every token itself.
    ports: ["127.0.0.1:8004:8004"]

networks:
  default:
    name: gradian
    external: true
