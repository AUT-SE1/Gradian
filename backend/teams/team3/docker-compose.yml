# Team 3: Final high-school exam preparation. Port 8003.
# Run from the repo root with `make 3`, or alone here with `docker compose up --build`
# (needs `docker network create gradian` once and a .env copied from .env.example).
name: gradian-team3
services:
  team3:
    build:
      context: .
      additional_contexts:
        packages: ../../packages
    env_file: .env
    volumes: [".:/app"]
    # Bound to localhost only: this is a development service. The service validates every token itself.
    ports: ["127.0.0.1:8003:8003"]

networks:
  default:
    name: gradian
    external: true
