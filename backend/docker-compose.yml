# Ports: 8080 Keycloak, 8000 Core Service, 5432 PostgreSQL (localhost only), 8001-8010 team services.
# Use the Makefile: it creates .env, renders the realm file and creates the shared network first.
name: gradian

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: keycloak/keycloak:26.0
    command: start-dev --import-realm
    user: root
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      CORE_ORIGIN: http://localhost:${CORE_PORT}
      KC_HEALTH_ENABLED: "true"
      FRONTEND_URL: ${FRONTEND_URL}
      KEYCLOAK_CORE_CLIENT_SECRET: ${KEYCLOAK_CORE_CLIENT_SECRET}
    volumes:
      - ./build/realm-gradian.json:/opt/keycloak/data/import/realm-gradian.json:ro
      - ./keycloak/themes/gradian:/opt/keycloak/themes/gradian:ro
      - keycloak_data:/opt/keycloak/data/h2
    ports: ["${KEYCLOAK_PORT}:8080"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          read -r status <&3 && [[ "$$status" == *" 200 "* ]]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  core:
    build:
      context: ./core
      target: runtime
      additional_contexts:
        packages: ./packages
    env_file: .env
    volumes: ["./core:/app", "./packages:/packages"]
    ports: ["${CORE_PORT}:8000"]
    depends_on:
      db: {condition: service_healthy}
      keycloak: {condition: service_healthy}
    command: python manage.py runserver --insecure 0.0.0.0:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  tools:
    profiles: ["tools"]
    build:
      context: ./core
      target: dev
      additional_contexts:
        packages: ./packages
    volumes: [".:/repo", "./packages:/packages"]
    working_dir: /repo/core
    environment:
      DJANGO_SETTINGS_MODULE: gradian.settings_test

volumes:
  db_data:
  keycloak_data:

networks:
  default:
    name: gradian
    external: true
