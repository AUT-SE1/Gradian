      - full_name
      - home_path
      - last_name
      - mobile
      - panel
      - role
      - sub
    Mission:
      type: object
      properties:
        title:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 300
        icon:
          type: string
          maxLength: 40
      required:
      - description
      - icon
      - title
    ModeEnum:
      enum:
      - embed
      - redirect
      type: string
      description: |-
        * `embed` - Embed
        * `redirect` - Redirect
    Navbar:
      type: object
      properties:
        brand:
          type: string
          maxLength: 60
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        login_label:
          type: string
          maxLength: 40
        register_label:
          type: string
          maxLength: 40
      required:
      - brand
      - links
      - login_label
      - register_label
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        body:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_read:
          type: boolean
          readOnly: true
      required:
      - body
      - created_at
      - id
      - is_read
      - title
    PaginatedNotificationList:
      type: object
      required:
      - unread_count
      - count
      - results
      properties:
        unread_count:
          type: integer
          example: 0
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
    PaginatedServiceEntryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/ServiceEntry'
    PaginatedServiceUserList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/ServiceUser'
    PaginatedUserList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/User'
    Panel:
      type: object
      properties:
        panel:
          type: string
        home_path:
          type: string
        header:
          $ref: '#/components/schemas/PanelHeader'
        countdown:
          $ref: '#/components/schemas/Countdown'
      required:
      - countdown
      - header
      - home_path
      - panel
    PanelHeader:
      type: object
      properties:
        full_name:
          type: string
        avatar_url:
          type: string
        consultant_type:
          type: string
          nullable: true
          description: '`consultant` or `top_ranker` for a consultant, otherwise null.'
        field_of_study:
          type: string
          nullable: true
          description: 'Students only: the value, empty until set. Null in every other
            panel.'
        field_of_study_label:
          type: string
          nullable: true
          description: Persian text for the field of study, null when there is none.
      required:
      - avatar_url
      - consultant_type
      - field_of_study
      - field_of_study_label
      - full_name
    PatchedMeUpdate:
      type: object
      description: |-
        Fields a person may change through PATCH /me. Role and mobile number cannot be changed
        here: the role is assigned by an administrator, and the mobile number is the login.
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        field_of_study:
          $ref: '#/components/schemas/FieldOfStudyEnum'
        avatar_url:
          oneOf:
          - type: string
            format: uri
          - type: string
            maxLength: 0
        bio:
          type: string
          maxLength: 500
    PatchedUserUpdate:
      type: object
      description: The mobile number is the login and cannot be changed.
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        role:
          $ref: '#/components/schemas/RoleEnum'
        consultant_type:
          $ref: '#/components/schemas/ConsultantTypeEnum'
        is_active:
          type: boolean
        field_of_study:
          $ref: '#/components/schemas/FieldOfStudyEnum'
    Ranker:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        rank:
          type: string
          description: Display text, e.g. رتبه ۱۲.
          maxLength: 40
        field:
          type: string
          maxLength: 60
        quote:
          type: string
          maxLength: 300
        avatar_url:
          type: string
          maxLength: 300
      required:
      - avatar_url
      - field
      - name
      - quote
      - rank
    RoleEnum:
      enum:
      - student
      - consultant
      - professor
      - admin
      type: string
      description: |-
        * `student` - Student
        * `consultant` - Consultant
        * `professor` - Professor
        * `admin` - Admin
    ServiceEntry:
      type: object
      properties:
        key:
          type: string
          readOnly: true
          description: Stable identifier, <panel>.<name>. Never change it once groups
            use it.
        title_fa:
          type: string
          readOnly: true
          title: Title (Persian)
        title_en:
          type: string
          readOnly: true
          title: Title (English)
        description:
          type: string
          readOnly: true
        button_label:
          type: string
          readOnly: true
        icon:
          type: string
          readOnly: true
        order:
          type: integer
          readOnly: true
          description: Position in the panel, smallest first.
        status:
          type: string
          readOnly: true
          description: '`available`, or `unavailable` when the entry is disabled or
            has no target URL.'
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeEnum'
          description: |-
            `embed`: load it in the content area. `redirect`: go there.

            * `embed` - Embed
            * `redirect` - Redirect
        url:
          readOnly: true
          description: Where to open the service. Null while it is unavailable.
      required:
      - button_label
      - description
      - icon
      - key
      - mode
      - order
      - status
      - title_en
      - title_fa
      - url
    ServiceUser:
      type: object
      description: A person's identity as a group service sees it.
      properties:
        sub:
          type: string
          format: uuid
          readOnly: true
        mobile:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        consultant_type:
          allOf:
          - $ref: '#/components/schemas/ConsultantTypeEnum'
          readOnly: true
        field_of_study:
          allOf:
          - $ref: '#/components/schemas/FieldOfStudyEnum'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        avatar_url:
          type: string
          format: uri
          readOnly: true
        bio:
          type: string
          readOnly: true
      required:
      - avatar_url
      - bio
      - consultant_type
      - email
      - field_of_study
      - first_name
      - full_name
      - is_active
      - last_name
      - mobile
      - role
      - sub
    StateEnum:
      enum:
      - upcoming
      - today
      - past
      type: string
      description: |-
        * `upcoming` - upcoming
        * `today` - today
        * `past` - past
    Statistic:
      type: object
      properties:
        key:
          type: string
          maxLength: 40
          pattern: ^[-a-zA-Z0-9_]+$
        value:
          type: string
          description: Display text, e.g. ۱۲٬۰۰۰+.
          maxLength: 30
        label:
          type: string
          maxLength: 80
      required:
      - key
      - label
      - value
    StreakDay:
      type: object
      properties:
        day:
          type: string
          maxLength: 20
        done:
          type: boolean
      required:
      - day
      - done
    StudyStreak:
      type: object
      properties:
        current_days:
          type: integer
          minimum: 0
        best_days:
          type: integer
          minimum: 0
        message:
          type: string
          maxLength: 200
        week:
          type: array
          items:
            $ref: '#/components/schemas/StreakDay'
      required:
      - best_days
      - current_days
      - message
      - week
    Teacher:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        title:
          type: string
          maxLength: 120
        bio:
          type: string
          maxLength: 300
        avatar_url:
          type: string
          maxLength: 300
      required:
      - avatar_url
      - bio
      - name
      - title
    Testimonial:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        role:
          type: string
          maxLength: 80
        text:
          type: string
          maxLength: 400
        avatar_url:
          type: string
          maxLength: 300
      required:
      - avatar_url
      - name
      - role
      - text
    User:
      type: object
      description: An account as an administrator sees it.
      properties:
        sub:
          type: string
          format: uuid
          readOnly: true
        mobile:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        consultant_type:
          allOf:
          - $ref: '#/components/schemas/ConsultantTypeEnum'
          readOnly: true
        panel:
          type: string
          readOnly: true
        home_path:
          type: string
          readOnly: true
        field_of_study:
          allOf:
          - $ref: '#/components/schemas/FieldOfStudyEnum'
          readOnly: true
        avatar_url:
          type: string
          format: uri
          readOnly: true
        bio:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - avatar_url
      - bio
      - consultant_type
      - email
      - field_of_study
      - first_name
      - full_name
      - home_path
      - is_active
      - last_name
      - mobile
      - panel
      - role
      - sub
    UserCreate:
      type: object
      properties:
        mobile:
          type: string
          description: 09123456789; Persian digits and +98 are accepted.
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        password:
          type: string
          writeOnly: true
          maxLength: 128
          minLength: 8
        role:
          $ref: '#/components/schemas/RoleEnum'
        consultant_type:
          allOf:
          - $ref: '#/components/schemas/ConsultantTypeEnum'
          description: |-
            Required for consultants.

            * `consultant` - Consultant
            * `top_ranker` - Top Ranker
        field_of_study:
          $ref: '#/components/schemas/FieldOfStudyEnum'
      required:
      - email
      - first_name
      - last_name
      - mobile
      - password
      - role
    Welcome:
      type: object
      properties:
        message:
          type: string
          description: '`{first_name}` and `{full_name}` are replaced per student.'
          maxLength: 300
        tip:
          type: string
          maxLength: 300
      required:
      - message
      - tip
  securitySchemes:
    keycloakBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An access token issued by Keycloak for the audience `gradian-core`.
    keycloakPassword:
      type: oauth2
      description: Development only. Enter a mobile number as the username, its password,
        and leave the client id as it is.
      flows:
        password:
          tokenUrl: http://keycloak.test/realms/gradian/protocol/openid-connect/token
          scopes: {}
