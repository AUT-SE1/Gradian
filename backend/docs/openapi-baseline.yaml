          readOnly: true
        home_path:
          type: string
          readOnly: true
        field_of_study:
          allOf:
          - $ref: '#/components/schemas/FieldOfStudyEnum'
          readOnly: true
        avatar_url:
          type: string
          format: uri
          readOnly: true
        bio:
          type: string
          readOnly: true
      required:
