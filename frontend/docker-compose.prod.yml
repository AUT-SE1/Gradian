name: gradian-frontend-prod

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    networks:
      - gradian

networks:
  gradian:
    external: true
    name: gradian
