# Team 5: Educational advising and study planning. Port 8005.
# Run from the repo root with `make 5`, or alone here with `docker compose up --build`
# (needs `docker network create gradian` once and a .env copied from .env.example).
name: gradian-team5
services:
  team5:
    build: .
    env_file: .env
    volumes: [".:/app"]
    # Bound to localhost only: the service trusts the X-User-* headers the core gateway sets,
    # so the outside world must reach it through the gateway (/api/teams/5/), never directly.
    ports: ["127.0.0.1:8005:8005"]

networks:
  default:
    name: gradian
    external: true
