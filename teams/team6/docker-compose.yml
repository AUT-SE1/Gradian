# Team 6: Book-related services. Port 8006.
# Run from the repo root with `make 6`, or alone here with `docker compose up --build`
# (needs `docker network create gradian` once and a .env copied from .env.example).
name: gradian-team6
services:
  team6:
    build: .
    env_file: .env
    volumes: [".:/app"]
    # Bound to localhost only: the service trusts the X-User-* headers the core gateway sets,
    # so the outside world must reach it through the gateway (/api/teams/6/), never directly.
    ports: ["127.0.0.1:8006:8006"]

networks:
  default:
    name: gradian
    external: true
