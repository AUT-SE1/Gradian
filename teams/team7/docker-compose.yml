# Team 7: Educational analysis. Port 8007.
# Run from the repo root with `make 7`, or alone here with `docker compose up --build`
# (needs `docker network create gradian` once and a .env copied from .env.example).
name: gradian-team7
services:
  team7:
    build: .
    env_file: .env
    volumes: [".:/app"]
    # Bound to localhost only: the service trusts the X-User-* headers the core gateway sets,
    # so the outside world must reach it through the gateway (/api/teams/7/), never directly.
    ports: ["127.0.0.1:8007:8007"]

networks:
  default:
    name: gradian
    external: true
