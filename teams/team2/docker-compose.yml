# Team 2: Educational assessment exams. Port 8002.
# Run from the repo root with `make 2`, or alone here with `docker compose up --build`
# (needs `docker network create gradian` once and a .env copied from .env.example).
name: gradian-team2
services:
  team2:
    build: .
    env_file: .env
    volumes: [".:/app"]
    # Bound to localhost only: the service trusts the X-User-* headers the core gateway sets,
    # so the outside world must reach it through the gateway (/api/teams/2/), never directly.
    ports: ["127.0.0.1:8002:8002"]

networks:
  default:
    name: gradian
    external: true
